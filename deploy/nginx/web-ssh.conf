# nginx перед web-ssh: TLS снаружи, сервис слушает только 127.0.0.1.
# Важно для WebSocket: без Upgrade/Connection прокси терминал молча не подключается,
# а форма входа при этом работает — типичная «странная» поломка.

upstream web_ssh {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ssh.example.com;

    ssl_certificate     /etc/ssl/dnikulshin/fullchain.pem;
    ssl_certificate_key /etc/ssl/dnikulshin/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Терминал не должен кэшироваться ни браузером, ни прокси.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 2m;

    location /ws/ {
        proxy_pass http://web_ssh;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Долгие паузы в терминале — норма: не рвать сокет по простою.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://web_ssh;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
