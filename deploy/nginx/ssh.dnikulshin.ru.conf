# nginx перед web-ssh на этой машине: ssh.dnikulshin.ru.
#
# Публичный адрес — https://ssh.dnikulshin.ru:8443 (роутер пробрасывает 8443 → 443,
# nginx на хосте слушает только 443). Сам сервис доступен лишь на 127.0.0.1:3030:
# если порт открыт наружу, nginx со всеми своими проверками перестаёт что-либо значить.
#
# Сертификат — существующий wildcard *.dnikulshin.ru, отдельный выпуск для этого имени
# не нужен (certbot на хосте не установлен). Продление wildcard'а автоматизировано
# не здесь: см. hair-lab/deploy/cert/install.md.
#
# Zones объявлены здесь, в http-контексте conf.d; имена не пересекаются с dev.conf.
# `map $http_upgrade $connection_upgrade` уже объявлен в dev.conf — второй такой map
# nginx не примет как дубликат, поэтому ниже Connection задаётся литералом.

limit_req_zone $binary_remote_addr zone=wssh:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=wssh_auth:10m rate=10r/m;

upstream web_ssh_local {
    server 127.0.0.1:3030;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ssh.dnikulshin.ru;

    ssl_certificate     /etc/ssl/dnikulshin/fullchain.pem;
    ssl_certificate_key /etc/ssl/dnikulshin/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:wssh_ssl:1m;

    # Терминал не кэшируется ни браузером, ни прокси: в кэше может оказаться чужая сессия.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 1m;

    # Второй замок. В приложении пока нет ни TOTP, ни ограничения частоты входов
    # (docs/handoff.md), а сервис держит SSH-креды и стоит на домашнем IP. Пока так:
    # basic-auth перед формой входа. Отключать — осознанно, вместе с пунктом 4 хендоффа.
    auth_basic "dev";
    auth_basic_user_file /etc/nginx/.dev_htpasswd;

    limit_req zone=wssh burst=120 nodelay;
    limit_req_status 429;

    # Перебор пароля владельца — единственное место, где он возможен.
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=wssh_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web_ssh_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # XFF перезаписывается, а не дописывается: приложение работает с trustProxy=true
        # и пишет этот адрес в audit_log. С $proxy_add_x_forwarded_for клиент подставляет
        # любой адрес одним заголовком.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кадры терминала. Без Upgrade/Connection терминал молча не поднимается, при том что
    # форма входа работает — типичная «странная» поломка, которую не видно по HTTP-логам.
    location /ws/ {
        proxy_pass http://web_ssh_local;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://web_ssh_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
